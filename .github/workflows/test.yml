---
name: Test

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nix develop .#ci --command bash -eo pipefail {0}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm run test
